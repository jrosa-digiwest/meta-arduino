# restored the saved clock, so hctosys would roll the clock back to 1970.
# Backport of meta-qcom-arduino 9e6ab74 ("linux-qcom/arduino: disable
# setting system time from RTC"), on wrynose as 67d8eae.
# CONFIG_RTC_HCTOSYS is not set
