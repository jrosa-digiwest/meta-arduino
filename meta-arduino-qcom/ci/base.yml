# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json

header:
  version: 14
  includes:
    - repo: meta-qcom-arduino
      file: ci/base.yml
    - repo: meta-qcom-arduino
      file: ci/qcom-distro.yml

repos:
  meta-qcom-arduino:
    url: https://github.com/qualcomm-linux/meta-qcom-arduino.git
    branch: wrynose

  # meta-arduino is a multi-layer repo; no url = current checkout
  meta-arduino:
    layers:
      meta-arduino-common:
      meta-arduino-qcom:

local_conf_header:
  arduino-logs: |
    # Development images: keep /var/log on disk (instead of a link to
    # /var/volatile/log on tmpfs) so logs survive reboots.
    FILESYSTEM_PERMS_TABLES:remove = "files/fs-perms-volatile-log.txt"

target:
  - arduino-console-image
  - arduino-container-image
  - arduino-full-image
