# NetworkManager's shared mode on usb0 (usb0-ncm) runs dnsmasq with this
# directory. Lease the host an address on the USB link only: without these
# lines the host also gets 10.11.99.1 as default gateway and DNS server and
# sends its own traffic through the board.
dhcp-option=tag:usb0,option:router
dhcp-option=tag:usb0,option:dns-server
