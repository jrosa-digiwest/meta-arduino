# arduino-router-serial (socat) holds /dev/ttyGS0, which belongs to the
# gadget's acm function. Removing that function (rmdir functions/acm.GS0)
# blocks in the kernel until every user closes the tty, so stop the proxy
# before the gadget is torn down and start it again once it is rebuilt.
#
# PartOf= names adbd only: adbd has Conflicts=usb-gadget.service, so an adbd
# restart also queues a stop of usb-gadget.service. With both units in
# PartOf=, that stop and the propagated restart conflict and systemd rejects
# the whole "systemctl restart android-tools-adbd" transaction.
[Unit]
PartOf=android-tools-adbd.service
After=usb-gadget.service android-tools-adbd.service
